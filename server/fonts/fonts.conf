<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- fontconfig for the Chromium container (F-005, ADR-0034): only these fonts, drawn without smoothing. -->
<fontconfig>
  <dir>/tintero/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>
  <match target="font">
    <!-- No smoothing: the capture comes out in pure black and white (1 bit). -->
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <!-- The font's own hinting instructions snap each stroke to the pixel grid. -->
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <!-- Bitmap fonts (Terminus) are drawn from their strikes. -->
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
