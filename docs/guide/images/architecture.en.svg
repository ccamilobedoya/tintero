<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14">
  <title>How Tintero fits together</title>
  <rect width="960" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
  </defs>
  <!-- Sources -->
  <g>
    <rect x="16" y="60" width="190" height="280" rx="10" fill="#f4f4f2" stroke="#888"/>
    <text x="111" y="88" text-anchor="middle" font-weight="bold">Your sources</text>
    <rect x="31" y="105" width="160" height="44" rx="6" fill="#fff" stroke="#888"/><text x="111" y="132" text-anchor="middle">Tasks (Trilium)</text>
    <rect x="31" y="160" width="160" height="44" rx="6" fill="#fff" stroke="#888"/><text x="111" y="187" text-anchor="middle">Calendars (iCal)</text>
    <rect x="31" y="215" width="160" height="44" rx="6" fill="#fff" stroke="#888"/><text x="111" y="242" text-anchor="middle">Public holidays</text>
    <rect x="31" y="270" width="160" height="44" rx="6" fill="#fff" stroke="#888" stroke-dasharray="5 4"/><text x="111" y="297" text-anchor="middle">Your integration</text>
  </g>
  <line x1="206" y1="200" x2="262" y2="200" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="234" y="188" text-anchor="middle" font-size="12">read</text>
  <!-- Server -->
  <g>
    <rect x="262" y="40" width="330" height="320" rx="10" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
    <text x="427" y="68" text-anchor="middle" font-weight="bold">Tintero server</text>
    <rect x="282" y="85" width="290" height="50" rx="6" fill="#fff" stroke="#4a6fa5"/><text x="427" y="108" text-anchor="middle">Integrations</text><text x="427" y="126" text-anchor="middle" font-size="12" fill="#555">allowed hosts and routes only</text>
    <rect x="282" y="150" width="290" height="50" rx="6" fill="#fff" stroke="#4a6fa5"/><text x="427" y="173" text-anchor="middle">View engine</text><text x="427" y="191" text-anchor="middle" font-size="12" fill="#555">draws 1-bit images (Chromium, no network)</text>
    <rect x="282" y="215" width="290" height="50" rx="6" fill="#fff" stroke="#4a6fa5"/><text x="427" y="238" text-anchor="middle">Device API v1</text><text x="427" y="256" text-anchor="middle" font-size="12" fill="#555">index · images · zones · actions</text>
    <text x="427" y="300" text-anchor="middle" font-size="12" fill="#555">Keys and data stay on the server</text>
    <text x="427" y="320" text-anchor="middle" font-size="12" fill="#555">Local services listen on 127.0.0.1 only</text>
  </g>
  <line x1="592" y1="240" x2="752" y2="240" stroke="#333" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="672" y="226" text-anchor="middle" font-size="12">HTTPS + mTLS</text>
  <text x="672" y="260" text-anchor="middle" font-size="12">TCP passthrough</text><text x="672" y="276" text-anchor="middle" font-size="12">(e.g. Tailscale Funnel)</text>
  <!-- Device -->
  <g>
    <rect x="752" y="100" width="192" height="240" rx="10" fill="#f4f4f2" stroke="#888"/>
    <text x="848" y="128" text-anchor="middle" font-weight="bold">E-ink display</text>
    <rect x="766" y="145" width="164" height="70" rx="4" fill="#fff" stroke="#333"/><text x="848" y="185" text-anchor="middle">7.5" e-paper</text>
    <text x="848" y="240" text-anchor="middle">ESP32 + DESPI-C02</text>
    <text x="848" y="262" text-anchor="middle" font-size="12" fill="#555">Move and Accept buttons</text>
    <text x="848" y="300" text-anchor="middle" font-size="12" fill="#555">Wakes, fetches what changed,</text>
    <text x="848" y="318" text-anchor="middle" font-size="12" fill="#555">sleeps next_wake_s</text>
  </g>
</svg>
