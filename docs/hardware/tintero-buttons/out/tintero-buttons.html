re apart.","vbe":"Vbe: voltage between base and emitter. It is a PN junction, like a diode: when it conducts it is about 0.6–0.7 V in a silicon transistor.","vce":"Vce: voltage between collector and emitter. With the transistor saturated (fully on) it falls to a few tenths of a volt; off, it rises almost to the supply voltage.","ib":"Ib: base current, the small current that goes into the base and controls the transistor.","ic":"Ic: collector current, the one that goes in through pin C and out through the emitter. It is the large current the transistor controls (here, the load current). In the active region it is β times Ib.","beta":"β (current gain): how many times larger Ic is than Ib in the active region. It varies a lot between transistors of the same model; the simulator uses a typical value.","vgs":"Vgs: voltage between the gate and the source of the MOSFET. Above the threshold (Vth), the electric field of the gate draws electrons and forms a channel between drain and source.","vds":"Vds: voltage between drain and source. With the MOSFET fully on it is small: its resistance Rds(on) times the current.","id":"Id: drain current, the one that flows from drain to source through the channel. It is the current the MOSFET controls.","pot.current":"Current into the potentiometer at each pin (positive in, negative out). The wiper (W) touches the resistive track and splits it in two.","floating":"Floating: this group has no DC path to the supply, so its voltage is not defined. On the bench, a multimeter would show a drifting value.","unsupported":"The simulator does not model this part yet: in the calculation its pins are left unconnected.","battery.emf":"Electromotive force (emf): the voltage the chemical reaction keeps up, the one measured with the circuit disconnected (open circuit). It depends on the chemistry and on how much charge is left.","battery.voltage":"Voltage at the terminals: the emf minus what is lost inside the battery, V = emf − I · r. It is what the multimeter reads with the circuit connected, and it drops as more current is drawn.","battery.drop":"Internal drop: the voltage that stays inside the battery, I · r, because of its internal resistance (r). That energy turns into heat inside the cell.","battery.current":"Current delivered: it leaves through the + terminal, goes round the circuit and comes back through −. Inside the battery the ions of the electrolyte close the path.","battery.power":"Power delivered to the circuit: V · I at the terminals. The battery also heats its own internal resistance with I² · r.","battery.runtime":"Estimated runtime: the capacity (in mAh) divided by this current. It is rough: at high currents or in the cold the real capacity is smaller, and the voltage drops before the end.","battery.charge":"State of charge: how much energy is left, from 0 % (empty) to 100 % (full). The open-circuit voltage follows it, along a different curve for each chemistry.","battery.off":"The holder switch opens the circuit: no current flows, and whatever was connected to the + terminal is left without a source.","reg.regulating":"Regulating: the chip adjusts its pass transistor so the output stays at its value while the input or the load change.","reg.dropout":"No headroom: the input is not high enough. The pass transistor is already fully on and the output sits a couple of volts below the input, unregulated.","reg.vin":"Voltage at the IN pin, measured from the circuit ground.","reg.vout":"Voltage at the OUT pin, measured from ground: what the load gets.","reg.headroom":"Headroom: input minus output. A linear regulator needs about 2 V to regulate; all that voltage times the current turns into heat inside the chip.","reg.iout":"Output current: it comes in at IN, goes through the pass transistor and leaves through OUT to the load.","reg.quiescent":"Own current: what the chip uses to work and returns through GND (on the LM317, the 50 µA that leave through ADJ into the resistors).","reg.led":"The module's power LED and its resistor, from OUT to GND inside the board. Its current leaves the chip through OUT but returns through GND without passing through the load: it is part of what the module draws.","switch.state":"On, the contact is closed and current flows; off, it is open. It stays where it is left: it does not spring back like a push button.","switch.contact":"Current through a closed contact: between those two pins a metal blade is pressed by a spring against the other, a few milliohms.","bridge.vac":"Voltage between the two AC pins (~), AC1 minus AC2. In a rectifier it comes from a transformer and changes sign every half cycle; here it is the value at this instant.","bridge.vdc":"Voltage between + and −: what the load receives. It is the AC side minus two diode drops (about 1.4–2 V), because the current always crosses two diodes: one going up to + and one coming back from −.","bridge.current":"Output current: it leaves by +, crosses the load and comes back by −. Whichever AC pin is higher, it always flows the same way through the load: that is rectifying.","sensor.temperature":"Temperature of the thermistor in the simulation (the temperature field of the circuit). On the bench it changes with the room, your fingers or its own heat.","sensor.light":"Light reaching the photoresistor, in lux (lx): a moonlit night is about 1 lx, a lit room 100–300 lx and direct sun over 30 000 lx.","sensor.resistance":"Resistance of the sensor in these conditions (temperature or light): the one the simulation uses.","region.bjt.off":"Off (cut-off): the base–emitter junction is not forward biased, so almost no collector current flows.","region.bjt.active":"Active: the transistor amplifies, Ic = β · Ib, and Vce still has room.","region.bjt.saturation":"Saturated: the base gets more current than needed and the transistor is fully on, like a closed switch. Ic is set by the rest of the circuit, not by β.","region.mosfet.off":"Off: Vgs is below the threshold, there is no channel and almost no current flows.","region.mosfet.linear":"On (linear region): the channel is formed and the MOSFET behaves like a small resistance, Rds(on). This is how it is used as a switch.","region.mosfet.saturation":"Saturation: the channel narrows near the drain and the current depends almost only on Vgs, not on Vds.","value.resistor":"Resistance: how much the part opposes the current, in ohms (Ω). By Ohm's law, I = V / R. The colour bands encode this value.","value.capacitor":"Capacitance: how much charge the capacitor stores per volt between its plates, in farads (F): Q = C · V. For example, 100 µF store 0.1 mC per volt. On electrolytics, the second number is the highest voltage it withstands.","value.potentiometer":"Total resistance of the track, between pins 1 and 3. The wiper (W) touches it at one point and splits it into two resistances that add up to that total.","value.led":"The colour comes from the chip material: when an electron recombines with a hole, each material releases photons of a different energy. That is why each colour has its own forward voltage (red ≈ 1.9 V, blue ≈ 3.2 V).","value.part":"Manufacturer part number: it names the exact model. Its pins, limits and typical values are in its datasheet.","value.battery":"Nominal voltage: the one printed on it, per cell or for the whole pack. The real one depends on how much charge is left: a new alkaline cell reads about 1.6 V and a full lithium cell 4.2 V. That is why it is measured before it is trusted.","value.zener":"Zener voltage (Vz): reverse biased, the diode lets current through once the voltage reaches this value, and holds it almost fixed while the current changes. It is given at the test current of its datasheet; with less current it sits a little lower.","value.inductor":"Inductance: how strongly the coil opposes a change in its current, in henries (H). When the current changes, the magnetic field around it changes too and induces a voltage that fights the change: V = L · ΔI/Δt. The colour rings give the value in microhenries, read like a resistor.","value.thermistor":"Resistance at 25 °C: its reference value (R25). It falls as it warms (NTC = negative temperature coefficient): a 10 kΩ part is about 3.6 kΩ at 50 °C, depending on its B constant.","describe.module+module.esp32":"Development board: a microcontroller already mounted with what it needs to work (voltage regulator, crystal, USB to load the program) and its pins brought out 2.54 mm apart. Each pin (GPIO) is a little switch the program sets to the supply voltage or to 0 V, or reads to know what voltage reaches it. Not simulated yet: here it only shows what each pin connects to. ESP32 DevKit: an ESP32 chip (two cores, Wi-Fi and Bluetooth) in the metal-can WROOM-32 module, a 3.3 V regulator and a CP2102 USB-serial converter. Its pins work at 3.3 V and do not take 5 V. It is wide: on a breadboard it covers most of the holes under it.","describe.button":"Push button: two metal plates that touch while you press it. The pins on each side (1 with 2, 3 with 4) are always joined inside.","describe.wire":"Jumper wire: joins two points of the board with almost no resistance.","describe.module.adapter+module.epaper":"Adapter board: a bridge between a part that cannot be wired by hand (a flat cable with tiny contacts) and 2.54 mm pins that take Dupont leads; sometimes it also makes the voltages that part needs. Not simulated yet: here it only shows what each pin connects to. GooDisplay DESPI-C02: brings a 24-contact e-paper panel FPC to 8 pins and makes the panel's high voltages (around ±15 V) from 3.3 V with a charge pump: a MOSFET switches an inductor, and when it opens the inductor's magnetic field pushes the current through diodes into capacitors. The RESE switch must match the panel's controller (0.47 Ω for the GDEY075T7's UC8179; 2.2 Ω for SSD ones). Everything at 3.3 V: never 5 V."},"focus":[],"text":{"pins":"Pins","leads":"Connected here","strip":"Open the card of this strip","results":null,"ghost":"See through","close":"Close","explain":"Tap a value to see what it means","gestureTouch":"Use two fingers to move the drawing","gestureWheel":"Use Ctrl (⌘ on a Mac) + scroll to zoom","fullscreen":"Full screen","fullscreenExit":"Exit full screen","tabPart":"Part","tabStrip":"Strip","model":"MODEL · DC simulation","modelShort":"MODEL"}}</script>
