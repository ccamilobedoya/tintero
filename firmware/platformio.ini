; Tintero · firmware for the ESP32 DevKit with the GDEY075T7 panel and the DESPI-C02 adapter.
[env:esp32dev]
; Pinned platform version: Arduino-ESP32 3.3.12 (on ESP-IDF 5), so it builds the
; same on any machine.
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; With TLS the program already takes 85 % of the factory partition (1.3 MB), and
; GxEPD2 comes on top: two app partitions of 1.9 MB.
board_build.partitions = min_spiffs.csv
lib_deps =
    zinggjm/GxEPD2
    bblanchon/ArduinoJson@^7
